name: Update preferred IPs
on:
  schedule:
    - cron: '15 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preferred-ips
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check country allocation
        run: python3 -m unittest discover -s tests -v
      - name: Scan and validate entrances
        env:
          NODE_PROFILE_JSON: ${{ secrets.NODE_PROFILE_JSON }}
        run: python3 scripts/update.py
      - name: Save scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-diagnostics
          path: |
            .work/scan.csv
            .work/scan.log
            .work/node-checks.json
            status.json
          retention-days: 7
      - name: Publish lists and latest status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in ip.txt global.txt status.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update preferred entrances and scan status'
            git push
          fi
